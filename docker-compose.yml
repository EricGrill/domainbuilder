version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: brandspark-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://brandspark.stencilwash.com
    depends_on:
      - api
    networks:
      - brandspark-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: brandspark-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - brandspark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/options"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  brandspark-network:
    driver: bridge
